<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pontos-Does | Player</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        /* Extra custom controls styling inside player page */
        .sidebar-folder-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gdrive-btn {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: var(--font-body);
            transition: all 0.3s ease;
        }
        .gdrive-btn:hover {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body>

    <header class="app-header">
        <a href="/player" class="brand-title">Pontos-Does</a>
        <nav class="nav-links">
            <a href="/player" class="nav-link active">Player</a>
            <a href="/history" class="nav-link">History</a>
            <div class="user-profile" id="user-profile-header">
                <!-- Injected via JS -->
                <div class="user-avatar" style="background: #1f1f2e;"></div>
            </div>
            <button class="logout-btn" onclick="window.location.href='/auth/logout'">Logout</button>
        </nav>
    </header>

    <div class="player-layout">
        <!-- Sidebar Source Picker -->
        <aside class="picker-sidebar">
            <h2 class="sidebar-title">Stream Source</h2>
            
            <div class="picker-tabs">
                <button class="tab-btn active" data-tab="gdrive">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    Google Drive
                </button>
                <button class="tab-btn" data-tab="terabox">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                    Terabox
                </button>
                <button class="tab-btn" data-tab="direct">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                    Direct URL
                </button>
            </div>

            <!-- Google Drive Tab Content -->
            <div class="tab-content active" id="tab-gdrive">
                <button class="gdrive-btn" id="picker-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    Pick GDrive Folder
                </button>
                <div class="sidebar-folder-info" style="display: none;" id="folder-info">
                    <span>Folder: <strong id="folder-name">None</strong></span>
                    <a href="#" id="clear-folder" style="color: #ef4444; text-decoration: none;">Clear</a>
                </div>
                <div class="gdrive-file-list" id="file-list-container">
                    <div style="padding: 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
                        No folder selected yet.
                    </div>
                </div>
            </div>

            <!-- Terabox Tab Content -->
            <div class="tab-content" id="tab-terabox">
                <div class="form-group">
                    <label class="form-label" for="terabox-url">Terabox Link</label>
                    <input class="form-input" type="url" id="terabox-url" placeholder="https://terabox.com/s/1..." required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="terabox-title">Video Title</label>
                    <input class="form-input" type="text" id="terabox-title" placeholder="My Terabox Movie" required>
                </div>
                <button class="action-btn" id="load-terabox-btn">Load Stream</button>
            </div>

            <!-- Direct URL Tab Content -->
            <div class="tab-content" id="tab-direct">
                <div class="form-group">
                    <label class="form-label" for="direct-url">Raw Stream URL</label>
                    <input class="form-input" type="url" id="direct-url" placeholder="https://example.com/movie.mp4" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="direct-title">Video Title</label>
                    <input class="form-input" type="text" id="direct-title" placeholder="My Direct Movie" required>
                </div>
                <button class="action-btn" id="load-direct-btn">Load Stream</button>
            </div>
        </aside>

        <!-- Right Side Player Canvas -->
        <main class="player-container">
            <div class="video-wrapper">
                <video id="pontos-player" class="video-js vjs-custom-skin vjs-big-play-centered" controls preload="auto" width="640" height="360">
                    <p class="vjs-no-js">
                        To view this video please enable JavaScript, and consider upgrading to a web browser that
                        <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
                    </p>
                </video>
            </div>
            <h1 class="now-playing-title" id="now-playing-title">No Video Loaded</h1>
        </main>
    </div>

    <!-- Google APIs for Picker -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>

    <!-- Video.js JS Library -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdn.sc.gl/videojs-hotkeys/0.2.28/videojs.hotkeys.min.js"></script>

    <!-- Player application logic -->
    <script src="/js/player.js"></script>
</body>
</html>
