<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pontos-Does | Your Cloud. Your Player. Your Rules.</title>
    <meta name="description" content="A premium cloud media player integrating Google Drive, Terabox, and direct links with tracking progress.">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="margin: 0; background-color: #0a0a0f;">

    <div class="landing-container">
        <!-- Canvas Background -->
        <canvas id="wave-canvas"></canvas>

        <!-- Top Header Navigation (empty by default, holds profile when logged in) -->
        <header class="landing-header"></header>

        <!-- Dead Center Wave Branding Overlay -->
        <main class="landing-hero">
            <h1 class="wave-title">Pontos-Does</h1>
            <p class="tagline">Your cloud. Your player. Your rules.</p>
        </main>

        <!-- Bottom Links Footer Section -->
        <footer class="landing-footer" style="flex-direction: column; gap: 1.25rem; margin-bottom: 1rem;">
            <!-- Sign-in Container -->
            <div id="login-container" style="display: flex; gap: 1.25rem; justify-content: center; align-items: center; flex-wrap: wrap;">
                <a href="/auth/google" class="auth-btn">Sign Up</a>
                <a href="/auth/google" class="auth-btn">Log In</a>
            </div>

            <div class="social-links glass-panel">
                <!-- GitHub -->
                <a href="https://github.com/ghanenxra" target="_blank" class="social-btn" aria-label="GitHub">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path>
                        <path d="M9 18c-4.51 2-5-2-7-2"></path>
                    </svg>
                </a>
                
                <!-- LinkedIn -->
                <a href="https://www.linkedin.com/in/ghanendra-chakradhari-28580a380/?skipRedirect=true" target="_blank" class="social-btn" aria-label="LinkedIn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                        <rect x="2" y="9" width="4" height="12"></rect>
                        <circle cx="4" cy="4" r="2"></circle>
                    </svg>
                </a>

                <!-- Email -->
                <a href="mailto:ghanuprosepic@gmail.com" class="social-btn" aria-label="Email">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    </svg>
                </a>

                <!-- Buy Me A Coffee (PayPal Me) -->
                <a href="https://www.paypal.com/paypalme/ghanenxra" target="_blank" class="social-btn coffee-btn" aria-label="Buy Me a Coffee">
                    <!-- Coffee Mug SVG -->
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 8h1a4 4 0 1 1 0 8h-1"></path>
                        <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path>
                        <line x1="6" y1="2" x2="6" y2="4"></line>
                        <line x1="10" y1="2" x2="10" y2="4"></line>
                        <line x1="14" y1="2" x2="14" y2="4"></line>
                    </svg>
                    Buy Us a Coffee
                </a>
            </div>
        </footer>
    </div>

    <script src="/js/main.js"></script>
</body>
</html>
